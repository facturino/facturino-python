[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "facturino"
version = "1.0.1"
description = "Python client library for the Facturino API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Facturino", email = "dev@facturino.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["facturino", "invoicing", "e-invoicing", "factur-x", "api"]
dependencies = [
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.21",
    "mypy>=1.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://facturino.com"
Documentation = "https://facturino.com/docs/api"
Repository = "https://github.com/facturino/facturino-python"
Issues = "https://github.com/facturino/facturino-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["facturino"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
